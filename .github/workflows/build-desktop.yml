name: Build Windows Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 恢复 Vue / Element Plus 资源
        run: npm run vendor

      - name: 配置代码签名（可选，提供证书 Secrets 时启用）
        shell: pwsh
        run: |
          if ('${{ secrets.WINDOWS_CSC_LINK }}') {
            "CSC_LINK=${{ secrets.WINDOWS_CSC_LINK }}" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "CSC_KEY_PASSWORD=${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            Write-Host '已启用代码签名'
          } else {
            Write-Host '未配置签名证书，跳过代码签名'
          }

      - name: 构建安装包与绿色版
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: 列出构建产物
        if: always()
        run: Get-ChildItem release -ErrorAction SilentlyContinue | Format-Table Name, Length

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: WebPrintTray-windows
          path: |
            desktop/release/*.exe
            desktop/release/*.zip

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/release/*.exe
            desktop/release/*.zip
          generate_release_notes: true
