name: Build Windows Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 恢复 Vue / Element Plus 资源
        run: npm run vendor

      - name: 配置代码签名（可选，提供证书 Secrets 时启用）
        shell: pwsh
        run: |
          if ('${{ secrets.WINDOWS_CSC_LINK }}') {
            "CSC_LINK=${{ secrets.WINDOWS_CSC_LINK }}" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "CSC_KEY_PASSWORD=${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            Write-Host '已启用代码签名'
          } else {
            Write-Host '未配置签名证书，跳过代码签名'
          }

      - name: 构建安装包与绿色版
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: 列出构建产物
        if: always()
        run: Get-ChildItem release -ErrorAction SilentlyContinue | Format-Table Name, Length

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: WebPrintTray-windows
          path: |
            desktop/release/*.exe
            desktop/release/*.zip

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/release/*.exe
            desktop/release/*.zip
          body: |
            ## WebPrint 打印助手 ${{ github.ref_name }}

            一体化 Windows 桌面应用：内置 **网页打印服务**、**本地打印** 与 **Cloudflare Tunnel**，开箱即用。

            ### 下载
            - `WebPrintTray-Setup-*.exe`：安装版（推荐）
            - `WebPrintTray-*-x64.zip`：免安装绿色版，解压后双击 `WebPrintTray.exe`

            ### 快速上手
            1. 运行程序，托盘出现图标，窗口自动打开
            2. 点「打开 Web 打印界面」，或访问 `http://127.0.0.1:3000`（局域网用 `http://本机IP:3000`）
            3. 默认账号 `admin / admin123`，登录后在「用户管理」中修改
            4. Word / Excel / PPT 转 PDF：需本机安装 **WPS** 或 **Microsoft Office**（WPS 优先，Office 兜底）

            ### 亮点
            - 桌面端与网页端统一的界面设计，图标一致
            - 游客配额（默认每 3 小时 5 次）与管理员用户管理
            - 文档预览、起止页码、份数、任务删除、失败自动重试
            - Cloudflare **快速隧道 + 命名隧道可同时启用**，各自独立启停；快速隧道支持关闭与刷新重建
            - 检查更新：可一键覆盖更新（安装版覆盖安装 / 绿色版解压覆盖）
            - 局域网访问、托盘常驻、开机自启

            ### ⚠️ 公网访问功能免责声明

            本程序支持通过 Cloudflare Tunnel 将本机网页打印服务发布到公网（快速隧道 / 命名隧道）。**启用公网访问前，请务必阅读并同意以下内容：**

            1. 公网访问会把本机打印能力暴露到互联网，**存在被他人滥用的风险**；请务必设置强密码并及时修改默认账号（`admin/admin123`）。
            2. 快速隧道由 Cloudflare 免费提供，公网地址随机、**可能随时失效或中断，可用性不作任何保证**。
            3. **政企、事业单位、涉密单位请注意：** 请勿通过公网隧道传输涉密、敏感或内部文件；如确需使用，请事先遵守本单位信息安全与保密规定并完成审批。
            4. 建议为公网域名叠加 **Cloudflare Access** 等访问控制，降低风险。
            5. **因启用公网访问产生的任何风险与后果，均由使用者自行承担。**

            首次启用公网访问时，应用会弹出上述免责声明，可勾选“下次不再提醒”。

            > 本程序未做代码签名，若被 SmartScreen / 杀毒软件误报，请参考仓库 README 的说明。
