# 薄壳客户端：不使用 AndroidX / Kotlin，仅依赖纯 Java 的 ZXing core，
# 以最大限度减少构建依赖与体积。
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=false
android.useAndroidX=false
android.nonTransitiveRClass=true

# ---------------------------------------------------------------------------
# 版本号
#
# 这里是客户端版本的唯一来源，用于本地构建。
# CI（.github/workflows/build-android.yml）在打 tag 时用 -PversionName/-PversionCode
# 覆盖它们，因此正式发布的 APK 版本号始终等于 tag（tag v2.2.0 → 2.2.0）。
#
# 发版时把这两项一起改：
#   versionName  语义化版本，APK 内「关于」对话框会显示它
#   versionCode  必须是单调递增整数；约定 major*10000 + minor*100 + patch
#                （例如 2.2.0 → 20200）
# ---------------------------------------------------------------------------
webprint.versionName=2.2.5
webprint.versionCode=20205
